[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mybootstrap_pyauth_itskovichanton"
version = "1.0.0"
authors = [
    { name = "Anton Itskovich", email = "itskovichae@gmail.com" },
]
description = "Authorization beans for pyioc-projects"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "argon2-cffi",
    "basicauth",
    "fastapi",
    "redis",
    "starlette",
]

[project.urls]
"Homepage" = "https://github.com/itskovichanton/pyauth"

[tool.hatch.build.targets.wheel]
packages = ["src"]
